---
- name: ORANGE LAB RUN - Collecte CLI Aruba AOS-S
  hosts: CSE-LAB-B01-ARU-SW
  gather_facts: false

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 30

    aruba_commands:
      - show version
      - show system
      - show interfaces brief
      - show vlan

  tasks:
    - name: Executer les commandes de collecte
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ aruba_commands }}"
      register: aruba_results

    - name: Definir la date de collecte
      ansible.builtin.set_fact:
        collection_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        collection_date: "{{ lookup('pipe', 'date \"+%d/%m/%Y %H:%M:%S\"') }}"

    - name: Definir le nom du rapport
      ansible.builtin.set_fact:
        report_filename: >-
          {{ inventory_hostname }}_{{ collection_timestamp }}.txt

    - name: Generer le rapport CLI
      ansible.builtin.template:
        src: ../templates/aruba_cli_report.j2
        dest: "/tmp/{{ report_filename }}"
        mode: "0644"
      delegate_to: localhost

    - name: Lire le rapport genere
      ansible.builtin.slurp:
        src: "/tmp/{{ report_filename }}"
      delegate_to: localhost
      register: generated_report

    - name: Afficher le rapport dans AWX
      ansible.builtin.debug:
        msg: "{{ generated_report.content | b64decode }}"

    - name: Afficher les informations du fichier
      ansible.builtin.debug:
        msg:
          - "Collecte terminee avec succes."
          - "Equipement : {{ inventory_hostname }}"
          - "IP : {{ ansible_host }}"
          - "Rapport : {{ report_filename }}"
