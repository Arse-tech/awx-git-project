---
- name: ORANGE LAB RUN - Collecte CLI Aruba AOS-S
  hosts: CSE-LAB-B01-ARU-SW
  gather_facts: false

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 30

    aruba_commands:
      - show version
      - show system
      - show interfaces brief
      - show vlan

  tasks:

    - name: Executer les commandes de collecte
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ aruba_commands }}"
      register: command_results

    - name: Generer le rapport CLI
      ansible.builtin.template:
        src: ../templates/aruba_cli_report.j2
        dest: "/tmp/{{ inventory_hostname }}_collecte.txt"
      delegate_to: localhost

    - name: Afficher le rapport dans AWX
      ansible.builtin.command:
        cmd: "cat /tmp/{{ inventory_hostname }}_collecte.txt"
      delegate_to: localhost
      register: cli_report
      changed_when: false

    - name: Rapport de collecte
      ansible.builtin.debug:
        msg: "{{ cli_report.stdout }}"
