---
- name: ORANGE LAB RUN - Collecte CLI Aruba AOS-S
  hosts: CSE-LAB-B01-ARU-SW
  gather_facts: false

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 30

    reports_root: "/awx-storage/reports/aruba"

    aruba_commands:
      - show version
      - show system
      - show interfaces brief
      - show vlan

  tasks:

    # ------------------------------------------------------------------
    # COLLECTE DES INFORMATIONS DU SWITCH ARUBA
    # ------------------------------------------------------------------

    - name: Collecter les informations Aruba
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ aruba_commands }}"
      register: aruba_results

    # ------------------------------------------------------------------
    # DATE / HORODATAGE
    # ------------------------------------------------------------------

    - name: Generer l'horodatage de la collecte
      ansible.builtin.command: date +%Y%m%d_%H%M%S
      delegate_to: localhost
      register: timestamp_cmd
      changed_when: false

    - name: Generer la date lisible de la collecte
      ansible.builtin.command: date "+%d/%m/%Y %H:%M:%S"
      delegate_to: localhost
      register: collection_date_cmd
      changed_when: false

    - name: Generer l'annee
      ansible.builtin.command: date +%Y
      delegate_to: localhost
      register: year_cmd
      changed_when: false

    - name: Generer le mois
      ansible.builtin.command: date +%m
      delegate_to: localhost
      register: month_cmd
      changed_when: false

    - name: Generer le jour
      ansible.builtin.command: date +%d
      delegate_to: localhost
      register: day_cmd
      changed_when: false

    # ------------------------------------------------------------------
    # VARIABLES DU RAPPORT
    # ------------------------------------------------------------------

    - name: Definir les informations de la collecte
      ansible.builtin.set_fact:
        collection_timestamp: "{{ timestamp_cmd.stdout }}"
        collection_date: "{{ collection_date_cmd.stdout }}"
        report_year: "{{ year_cmd.stdout }}"
        report_month: "{{ month_cmd.stdout }}"
        report_day: "{{ day_cmd.stdout }}"

    - name: Definir le repertoire du rapport
      ansible.builtin.set_fact:
        report_directory: >-
          {{ reports_root }}/{{ inventory_hostname }}/{{ report_year }}/{{ report_month }}/{{ report_day }}

    - name: Definir les chemins des rapports
      ansible.builtin.set_fact:
        txt_report: "{{ report_directory }}/{{ inventory_hostname }}_{{ collection_timestamp }}.txt"
        pdf_report: "{{ report_directory }}/{{ inventory_hostname }}_{{ collection_timestamp }}.pdf"

    # ------------------------------------------------------------------
    # CREATION DU REPERTOIRE SUR LE STOCKAGE NFS
    # ------------------------------------------------------------------

    - name: Creer le repertoire de stockage du rapport
      ansible.builtin.file:
        path: "{{ report_directory }}"
        state: directory
        mode: "2775"
      delegate_to: localhost

    # ------------------------------------------------------------------
    # GENERATION DU RAPPORT TXT
    # ------------------------------------------------------------------

    - name: Generer le rapport TXT
      ansible.builtin.template:
        src: "../templates/aruba_cli_report.j2"
        dest: "{{ txt_report }}"
        mode: "0664"
      delegate_to: localhost

    # ------------------------------------------------------------------
    # GENERATION DU RAPPORT PDF
    # ------------------------------------------------------------------

    - name: Generer le rapport PDF
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/generate_cli_pdf.py"
          - "{{ txt_report }}"
          - "{{ pdf_report }}"
          - "{{ inventory_hostname }}"
          - "{{ ansible_host }}"
      delegate_to: localhost
      register: pdf_generation
      changed_when: true

    # ------------------------------------------------------------------
    # VERIFICATION DU RAPPORT TXT
    # ------------------------------------------------------------------

    - name: Verifier le rapport TXT
      ansible.builtin.stat:
        path: "{{ txt_report }}"
      delegate_to: localhost
      register: txt_report_stat

    # ------------------------------------------------------------------
    # VERIFICATION DU RAPPORT PDF
    # ------------------------------------------------------------------

    - name: Verifier le rapport PDF
      ansible.builtin.stat:
        path: "{{ pdf_report }}"
      delegate_to: localhost
      register: pdf_report_stat

    # ------------------------------------------------------------------
    # VALIDATION DES RAPPORTS
    # ------------------------------------------------------------------

    - name: Valider la generation des rapports
      ansible.builtin.assert:
        that:
          - txt_report_stat.stat.exists
          - txt_report_stat.stat.size | int > 0
          - pdf_report_stat.stat.exists
          - pdf_report_stat.stat.size | int > 0
        fail_msg: "Echec de generation ou rapport vide."
        success_msg: "Les rapports TXT et PDF ont ete generes avec succes."

    # ------------------------------------------------------------------
    # LECTURE DU RAPPORT TXT
    # ------------------------------------------------------------------

    - name: Lire le rapport TXT genere
      ansible.builtin.slurp:
        src: "{{ txt_report }}"
      delegate_to: localhost
      register: txt_report_content

    - name: Afficher le contenu du rapport TXT
      ansible.builtin.debug:
        msg: "{{ txt_report_content.content | b64decode }}"

    # ------------------------------------------------------------------
    # RESUME DE LA COLLECTE
    # ------------------------------------------------------------------

    - name: Afficher le resume de la collecte
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - " ORANGE LAB RUN - IEC"
          - " RAPPORT ARUBA GENERE AVEC SUCCES"
          - "=============================================="
          - "Equipement : {{ inventory_hostname }}"
          - "Adresse IP : {{ ansible_host }}"
          - "Constructeur : {{ device_vendor | default('Aruba') }}"
          - "Role : {{ device_role | default('Non defini') }}"
          - "Statut : {{ device_status | default('Non defini') }}"
          - "Stockage NFS : 172.16.23.162:/srv/awx-storage"
          - "Repertoire : {{ report_directory }}"
          - "Rapport TXT : {{ txt_report }}"
          - "Taille TXT : {{ txt_report_stat.stat.size }} octets"
          - "Rapport PDF : {{ pdf_report }}"
          - "Taille PDF : {{ pdf_report_stat.stat.size }} octets"
          - "=============================================="
