---
# Aruba Firmware - 03 Upgrade Secondary
# Version V03.5.1 - Multi-switch / TRANSFERT SECONDARY AVEC DOUBLE AUTORISATION
# Transfert Secondary uniquement si deux autorisations explicites sont vraies.
# AUCUN redemarrage ni changement de boot.
# IMPORTANT : Approval A AWX non verifie automatiquement.
# Approval A n'est PAS verifie automatiquement par ce playbook.
# Le prompt de confirmation doit etre valide sur le firmware reel avant autorisation.

- name: Valider la cible AWX
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/aruba_firmware_devices.yml
  tasks:
    - name: Verifier la selection du switch
      ansible.builtin.assert:
        that:
          - target_device is defined
          - target_device | default('') is match('^[A-Za-z0-9_.-]+$')
          - target_device in groups['all']
          - target_device in aruba_firmware_devices
          - hostvars[target_device].device_vendor | default('') | lower == 'aruba'
        fail_msg: >-
          Cible absente, inconnue ou non autorisee.
          Selectionner un switch Aruba reference dans vars/aruba_firmware_devices.yml.

    - name: Afficher la cible selectionnee
      ansible.builtin.debug:
        msg:
          - "Switch : {{ target_device }}"
          - "IP : {{ hostvars[target_device].ansible_host | default('non renseignee') }}"
          - "Firmware cible : {{ aruba_firmware_target.version }}"
          - "Mode : V03.5.1 - transfert conditionnel"

- name: Precontrole et transfert firmware Secondary V03.5.1
  hosts: "{{ target_device }}"
  gather_facts: false
  vars_files:
    - ../vars/aruba_firmware_devices.yml
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 120
    firmware_expected: "{{ aruba_firmware_devices[inventory_hostname] }}"
    # Valeurs du serveur TFTP valide pour ce lab ; aucune execution de la commande.
    firmware_tftp_server: "172.16.23.162"
    firmware_tftp_path: "aruba/2930F/WC_16_11_0030.swi"
    report_directory: >-
      /awx-storage/reports/aruba/{{ inventory_hostname }}/upgrade-{{
      awx_workflow_job_id | default('manual', true)
      }}-job-{{ awx_job_id | default('manual', true) }}

  tasks:
    - name: Verifier la cible unique et la configuration de reference
      ansible.builtin.assert:
        that:
          - target_device is defined
          - inventory_hostname == target_device
          - target_device | default('') is match('^[A-Za-z0-9_.-]+$')
          - hostvars[inventory_hostname].device_vendor | default('') | lower == 'aruba'
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in aruba_firmware_devices
          - firmware_expected.primary_before is defined
          - firmware_expected.secondary_before is defined
          - firmware_expected.running_before is defined
          - firmware_expected.boot_image_before is defined
          - firmware_expected.default_boot_before is defined
          - aruba_firmware_target.version is defined
          - aruba_firmware_target.local_path is defined
          - aruba_firmware_target.size_bytes is defined
          - aruba_firmware_target.sha256 is defined
          - aruba_firmware_target.version == 'WC.16.11.0030'
          - firmware_tftp_path == 'aruba/2930F/WC_16_11_0030.swi'
        fail_msg: "Cible multiple ou configuration firmware incomplete/inattendue."

    - name: Verifier la presence du firmware dans EE
      ansible.builtin.stat:
        path: "{{ aruba_firmware_target.local_path }}"
        checksum_algorithm: sha256
        get_checksum: true
      delegate_to: localhost
      register: firmware_file

    - name: Verifier l'integrite du firmware
      ansible.builtin.assert:
        that:
          - firmware_file.stat.exists | default(false)
          - firmware_file.stat.isreg | default(false)
          - firmware_file.stat.size | default(0) | int == aruba_firmware_target.size_bytes | int
          - firmware_file.stat.checksum | default('') == aruba_firmware_target.sha256
        fail_msg: "Firmware SWI absent ou integrite incorrecte."

    - name: Lire show version
      ansible.netcommon.cli_command:
        command: show version
      register: show_version
      changed_when: false

    - name: Lire show flash
      ansible.netcommon.cli_command:
        command: show flash
      register: show_flash
      changed_when: false

    - name: Extraire les informations firmware
      ansible.builtin.set_fact:
        primary_versions: >-
          {{ show_flash.stdout | regex_findall('(?im)^Primary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)') }}
        secondary_versions: >-
          {{ show_flash.stdout | regex_findall('(?im)^Secondary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)') }}
        running_versions: >-
          {{ show_version.stdout | regex_findall('(?m)^\s*(WC\.\d+\.\d+\.\d+)\s*$') }}
        active_images: >-
          {{ show_version.stdout | regex_findall('(?im)^Boot Image:\s*(Primary|Secondary)\s*$') }}
        default_images: >-
          {{ show_flash.stdout | regex_findall('(?im)^Default Boot Image\s*:\s*(Primary|Secondary)\s*$') }}

    - name: Verifier que les informations sont lisibles sans ambiguite
      ansible.builtin.assert:
        that:
          - primary_versions | length == 1
          - secondary_versions | length == 1
          - running_versions | length == 1
          - active_images | length == 1
          - default_images | length == 1
        fail_msg: "Etat flash ou boot ambigu. Aucun transfert autorise."

    - name: Enregistrer l'etat detecte
      ansible.builtin.set_fact:
        firmware_detected:
          primary: "{{ primary_versions[0] }}"
          secondary: "{{ secondary_versions[0] }}"
          running: "{{ running_versions[0] }}"
          boot_image: "{{ active_images[0] }}"
          default_boot: "{{ default_images[0] }}"

    - name: Comparer l'etat reel avec la reference
      ansible.builtin.assert:
        that:
          - firmware_detected.primary == firmware_expected.primary_before
          - firmware_detected.secondary == firmware_expected.secondary_before
          - firmware_detected.running == firmware_expected.running_before
          - firmware_detected.boot_image == firmware_expected.boot_image_before
          - firmware_detected.default_boot == firmware_expected.default_boot_before
        fail_msg: "Etat du switch different de la reference. Aucun transfert autorise."

    - name: Proteger Primary et la partition active
      ansible.builtin.assert:
        that:
          - firmware_detected.boot_image == 'Primary'
          - firmware_detected.default_boot == 'Primary'
          - firmware_detected.running == firmware_detected.primary
          - firmware_detected.secondary != aruba_firmware_target.version
        fail_msg: >-
          Secondary est active, le boot n'est pas sur Primary,
          ou Secondary contient deja la version cible. Aucune operation preparee.

    - name: Preparer la commande TFTP Secondary sans execution
      ansible.builtin.set_fact:
        firmware_secondary_command_preview: >-
          copy tftp flash {{ firmware_tftp_server }} {{ firmware_tftp_path }} secondary

    - name: Determiner si le transfert est explicitement autorise
      ansible.builtin.set_fact:
        transfer_requested: >-
          {{
            (secondary_transfer_authorized | default(false) | bool)
            and (secondary_flash_risk_accepted | default(false) | bool)
          }}

    - name: Refuser une autorisation partielle
      ansible.builtin.assert:
        that:
          - (secondary_transfer_authorized | default(false) | bool) == (secondary_flash_risk_accepted | default(false) | bool)
        fail_msg: "Les deux autorisations doivent etre false ou toutes les deux true."

    - name: Creer le repertoire de rapport
      ansible.builtin.file:
        path: "{{ report_directory }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Verifier l'acces TFTP et le contenu exact avant toute ecriture
      when: transfer_requested | bool
      block:
        - name: Creer un fichier temporaire de verification dans EE
          ansible.builtin.tempfile:
            state: file
            suffix: .swi
          delegate_to: localhost
          register: tftp_download_temp

        - name: Telecharger le firmware via TFTP depuis EE
          ansible.builtin.command:
            argv:
              - curl
              - --fail
              - --silent
              - --show-error
              - --max-time
              - "180"
              - --output
              - "{{ tftp_download_temp.path }}"
              - "tftp://{{ firmware_tftp_server }}/{{ firmware_tftp_path }}"
          delegate_to: localhost
          register: tftp_download_result
          changed_when: false

        - name: Calculer l'empreinte du fichier TFTP recu
          ansible.builtin.stat:
            path: "{{ tftp_download_temp.path }}"
            checksum_algorithm: sha256
            get_checksum: true
          delegate_to: localhost
          register: tftp_download_file

        - name: Comparer le fichier TFTP au firmware attendu
          ansible.builtin.assert:
            that:
              - tftp_download_file.stat.isreg | default(false)
              - tftp_download_file.stat.size | default(0) | int == aruba_firmware_target.size_bytes | int
              - tftp_download_file.stat.checksum | default('') == aruba_firmware_target.sha256
            fail_msg: "Le fichier servi par TFTP est absent ou differe du firmware valide."
      always:
        - name: Supprimer la copie temporaire du firmware TFTP
          ansible.builtin.file:
            path: "{{ tftp_download_temp.path }}"
            state: absent
          delegate_to: localhost
          when: tftp_download_temp is defined and tftp_download_temp.path is defined

    - name: Enregistrer le rapport avant transfert
      ansible.builtin.copy:
        dest: "{{ report_directory }}/secondary_transfer_v0351.json"
        mode: "0600"
        content: |
          {{
            {
              "stage": "secondary_transfer_v0351",
              "target_device": inventory_hostname,
              "target_ip": ansible_host | default(""),
              "workflow_job_id": awx_workflow_job_id | default("manual", true),
              "awx_job_id": awx_job_id | default("manual", true),
              "firmware_target": aruba_firmware_target.version,
              "firmware_sha256": firmware_file.stat.checksum,
              "expected_before": firmware_expected,
              "detected_before": firmware_detected,
              "secondary_command": firmware_secondary_command_preview,
              "approval_awx_verified": false,
              "transfer_requested": transfer_requested | bool,
              "transfer_executed": false,
              "reboot_executed": false
            } | to_nice_json
          }}
      delegate_to: localhost

    - name: Transferer le firmware dans Secondary uniquement
      ansible.netcommon.cli_command:
        command: "{{ firmware_secondary_command_preview }}"
        prompt:
          - '(?is)secondary image will be deleted.*Continue\s*\(y/n\)\?'
        answer:
          - 'y'
        check_all: true
      register: secondary_transfer_result
      vars:
        ansible_command_timeout: 1200
      when: transfer_requested | bool
      # Conserver les diagnostics de la commande; ne pas inclure de secret dans sa sortie.
      no_log: false

    - name: Verifier la sortie de transfert avant controle flash
      ansible.builtin.assert:
        that:
          - secondary_transfer_result is succeeded
          - secondary_transfer_result.stdout is defined
          - secondary_transfer_result.stdout | regex_search('(?i)(transport error|peer unreachable|error in sending|timed out|invalid input|failed)') is none
        fail_msg: "La commande TFTP a signale une erreur. Ne pas redemarrer; verifier show flash."
      when: transfer_requested | bool

    - name: Relire show version apres transfert
      ansible.netcommon.cli_command:
        command: show version
      register: show_version_after
      changed_when: false
      when: transfer_requested | bool

    - name: Relire show flash apres transfert
      ansible.netcommon.cli_command:
        command: show flash
      register: show_flash_after
      changed_when: false
      when: transfer_requested | bool

    - name: Extraire les versions apres transfert
      ansible.builtin.set_fact:
        primary_after: >-
          {{ show_flash_after.stdout | regex_findall('(?im)^Primary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)') }}
        secondary_after: >-
          {{ show_flash_after.stdout | regex_findall('(?im)^Secondary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)') }}
        running_after: >-
          {{ show_version_after.stdout | regex_findall('(?m)^\s*(WC\.\d+\.\d+\.\d+)\s*$') }}
        active_after: >-
          {{ show_version_after.stdout | regex_findall('(?im)^Boot Image:\s*(Primary|Secondary)\s*$') }}
        default_after: >-
          {{ show_flash_after.stdout | regex_findall('(?im)^Default Boot Image\s*:\s*(Primary|Secondary)\s*$') }}
      when: transfer_requested | bool

    - name: Confirmer Secondary mise a jour et Primary intacte
      ansible.builtin.assert:
        that:
          - primary_after | length == 1
          - secondary_after | length == 1
          - running_after | length == 1
          - active_after | length == 1
          - default_after | length == 1
          - primary_after[0] == firmware_detected.primary
          - secondary_after[0] == aruba_firmware_target.version
          - running_after[0] == firmware_detected.running
          - active_after[0] == 'Primary'
          - default_after[0] == 'Primary'
        fail_msg: "Verification post-transfert non conforme. Ne pas redemarrer."
      when: transfer_requested | bool

    - name: Enregistrer le rapport final de transfert
      ansible.builtin.copy:
        dest: "{{ report_directory }}/secondary_transfer_v0351.json"
        mode: "0600"
        content: |
          {{
            {
              "stage": "secondary_transfer_v0351",
              "target_device": inventory_hostname,
              "target_ip": ansible_host | default(""),
              "workflow_job_id": awx_workflow_job_id | default("manual", true),
              "awx_job_id": awx_job_id | default("manual", true),
              "firmware_target": aruba_firmware_target.version,
              "firmware_sha256": firmware_file.stat.checksum,
              "detected_before": firmware_detected,
              "raw_show_flash_after": show_flash_after.stdout,
              "raw_show_version_after": show_version_after.stdout,
              "approval_awx_verified": false,
              "transfer_requested": true,
              "transfer_executed": true,
              "post_transfer_verified": true,
              "reboot_executed": false
            } | to_nice_json
          }}
      delegate_to: localhost
      when: transfer_requested | bool

    - name: Afficher le bilan V03.5.1
      ansible.builtin.debug:
        msg:
          - "Switch : {{ inventory_hostname }}"
          - "Primary avant : {{ firmware_detected.primary }}"
          - "Secondary avant : {{ firmware_detected.secondary }}"
          - "Firmware cible : {{ aruba_firmware_target.version }}"
          - "Transfert demande : {{ transfer_requested | bool }}"
          - "Transfert verifie : {{ (transfer_requested | bool) and (secondary_after | default([]) | length == 1) }}"
          - "Aucun redemarrage. Approbation AWX non verifiee automatiquement."
          - "Rapport : {{ report_directory }}/secondary_transfer_v0351.json"
