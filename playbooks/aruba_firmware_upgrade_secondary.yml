
---
# ============================================================
# Aruba 2930F - Upgrade firmware Secondary V03.2
#
# Firmware cible : WC.16.11.0030
# Partition      : SECONDARY UNIQUEMENT
#
# ATTENTION :
# - Le transfert TFTP ecrit dans la flash du switch.
# - L'ancienne image Secondary sera remplacee.
# - Aucun boot / reload / reboot dans ce playbook.
# - Capacite flash non verifiee : risque accepte explicitement.
# ============================================================

- name: Valider la cible AWX et les autorisations
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Verifier target_device
      ansible.builtin.assert:
        that:
          - target_device is defined
          - target_device | default('') is match('^[A-Za-z0-9_.-]+$')
          - target_device in groups['all']
          - hostvars[target_device].device_vendor | default('') | lower == 'aruba'
        fail_msg: "Cible AWX absente, invalide ou non Aruba."

    - name: Verifier l'autorisation explicite de transfert
      ansible.builtin.assert:
        that:
          - secondary_transfer_authorized | default(false) | bool
          - secondary_flash_risk_accepted | default(false) | bool
        fail_msg: >-
          Transfert interdit.
          Fournir secondary_transfer_authorized=true et
          secondary_flash_risk_accepted=true uniquement
          apres approbation de l'operation.

    - name: Construire le groupe temporaire
      ansible.builtin.add_host:
        name: "{{ target_device }}"
        groups: aruba_workflow_target
      changed_when: false


- name: Installer le firmware sur Secondary uniquement
  hosts: aruba_workflow_target
  gather_facts: false

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 900

    firmware_target: "WC.16.11.0030"
    firmware_primary_expected: "WC.16.11.0010"
    firmware_secondary_expected: "WC.16.07.0003"

    firmware_file: "/awx-storage/firmwares/aruba/2930F/WC_16_11_0030.swi"
    firmware_size_expected: 30294326
    firmware_sha256: "4749334ebdb4989c6176643b2daf57514441348778899895dc08d1c1d546e42d"

    tftp_server: "172.16.23.162"
    tftp_filename: "aruba/2930F/WC_16_11_0030.swi"

    archive_root: "/awx-storage/reports/aruba"
    workflow_id: "{{ awx_workflow_job_id | default('manual') }}"
    job_id: "{{ awx_job_id | default('manual') }}"
    run_dir: "{{ archive_root }}/{{ inventory_hostname }}/upgrade-{{ workflow_id }}-job-{{ job_id }}"

    transfer_command: >-
      copy tftp flash {{ tftp_server }} {{ tftp_filename }} secondary

  tasks:

    # ========================================================
    # 1. VERIFIER LE FIRMWARE LOCAL
    # ========================================================

    - name: Calculer le SHA-256 du firmware dans l'EE
      ansible.builtin.stat:
        path: "{{ firmware_file }}"
        checksum_algorithm: sha256
      register: image_file
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Verifier taille et empreinte du firmware
      ansible.builtin.assert:
        that:
          - image_file.stat.isreg | default(false)
          - image_file.stat.size | default(0) | int == firmware_size_expected
          - image_file.stat.checksum | default('') == firmware_sha256
        fail_msg: "Firmware SWI absent ou non conforme."

    # ========================================================
    # 2. CONTROLER L'ETAT INITIAL DU SWITCH
    # ========================================================

    - name: Lire show system avant transfert
      ansible.netcommon.cli_command:
        command: show system
      register: system_before
      changed_when: false

    - name: Lire show flash avant transfert
      ansible.netcommon.cli_command:
        command: show flash
      register: flash_before
      changed_when: false

    - name: Extraire les versions initiales
      ansible.builtin.set_fact:
        primary_before: >-
          {{
            flash_before.stdout |
            regex_findall('(?im)Primary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)')
          }}
        secondary_before: >-
          {{
            flash_before.stdout |
            regex_findall('(?im)Secondary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)')
          }}
      changed_when: false

    - name: Verifier les partitions avant ecriture
      ansible.builtin.assert:
        that:
          - primary_before | length == 1
          - secondary_before | length == 1
          - primary_before[0] == firmware_primary_expected
          - secondary_before[0] == firmware_secondary_expected
          - firmware_primary_expected in system_before.stdout
          - flash_before.stdout is search('(?im)Default Boot Image\s*:\s*Primary')
        fail_msg: >-
          Etat initial non conforme.
          Aucun transfert Secondary autorise.

    # ========================================================
    # 3. CREER LA TRACE D'AUDIT AVANT ECRITURE
    # ========================================================

    - name: Creer le repertoire de traces NFS
      ansible.builtin.file:
        path: "{{ run_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Archiver l'etat avant transfert
      ansible.builtin.copy:
        dest: "{{ run_dir }}/secondary_before.json"
        mode: "0600"
        content: |
          {{
            {
              'phase': 'SECONDARY_BEFORE_TRANSFER',
              'target': inventory_hostname,
              'job': job_id,
              'firmware_target': firmware_target,
              'firmware_sha256': image_file.stat.checksum,
              'primary_before': primary_before[0],
              'secondary_before': secondary_before[0],
              'flash_capacity_verified': false,
              'flash_capacity_risk_accepted': true,
              'transfer_command': transfer_command,
              'show_flash': flash_before.stdout,
              'show_system': system_before.stdout
            } | to_nice_json
          }}
      delegate_to: localhost
      vars:
        ansible_connection: local

    # ========================================================
    # 4. DERNIERE VALIDATION AVANT ECRITURE
    # ========================================================

    - name: Confirmer les autorisations juste avant transfert
      ansible.builtin.assert:
        that:
          - secondary_transfer_authorized | bool
          - secondary_flash_risk_accepted | bool
          - inventory_hostname == target_device
          - primary_before[0] == firmware_primary_expected
          - secondary_before[0] == firmware_secondary_expected
        fail_msg: "Autorisation ou etat du switch non conforme."

    # ========================================================
    # 5. TRANSFERT TFTP VERS SECONDARY
    #
    # Cette tache MODIFIE la flash du switch.
    # ========================================================

    - name: Transferer le firmware TFTP vers Secondary
      ansible.netcommon.cli_command:
        command: "{{ transfer_command }}"
        prompt:
          - 'Continue \(y/n\)\?'
        answer:
          - 'y'
        check_all: false
      register: transfer_result
      changed_when: true
      no_log: false

    # ========================================================
    # 6. VERIFICATION APRES TRANSFERT
    # ========================================================

    - name: Lire show flash apres transfert
      ansible.netcommon.cli_command:
        command: show flash
      register: flash_after
      changed_when: false

    - name: Extraire les versions apres transfert
      ansible.builtin.set_fact:
        primary_after: >-
          {{
            flash_after.stdout |
            regex_findall('(?im)Primary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)')
          }}
        secondary_after: >-
          {{
            flash_after.stdout |
            regex_findall('(?im)Secondary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)')
          }}
      changed_when: false

    - name: Valider Secondary et proteger Primary
      ansible.builtin.assert:
        that:
          - primary_after | length == 1
          - secondary_after | length == 1
          - primary_after[0] == firmware_primary_expected
          - secondary_after[0] == firmware_target
          - flash_after.stdout is search('(?im)Default Boot Image\s*:\s*Primary')
        fail_msg: >-
          Verification apres transfert NON CONFORME.
          Ne pas redemarrer le switch.

    - name: Archiver le resultat du transfert
      ansible.builtin.copy:
        dest: "{{ run_dir }}/secondary_after.json"
        mode: "0600"
        content: |
          {{
            {
              'phase': 'SECONDARY_TRANSFER_COMPLETED',
              'target': inventory_hostname,
              'job': job_id,
              'primary_after': primary_after[0],
              'secondary_after': secondary_after[0],
              'show_flash': flash_after.stdout,
              'transfer_output': transfer_result.stdout,
              'reboot_executed': false
            } | to_nice_json
          }}
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Afficher le bilan
      ansible.builtin.debug:
        msg:
          - "Transfert Secondary termine."
          - "Primary conservee : {{ primary_after[0] }}"
          - "Secondary installee : {{ secondary_after[0] }}"
          - "Aucun redemarrage execute."
          - "Rapports : {{ run_dir }}"
