
---
# ============================================================
# Aruba 2930F - Firmware Upgrade Secondary V03.1
#
# ETAT ACTUEL : TRANSFERT DESACTIVE
#
# Le playbook effectue les controles en lecture seule.
# Le transfert TFTP ne peut etre active qu'apres homologation
# des prerequis et modification explicite du code.
#
# AUCUN BOOT / REBOOT.
# ============================================================

- name: Valider la cible AWX
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Verifier que target_device est fourni
      ansible.builtin.assert:
        that:
          - target_device is defined
          - target_device | default('') | length > 0
          - target_device | default('') is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Variable target_device absente ou invalide."

    - name: Verifier la presence dans l'inventaire
      ansible.builtin.assert:
        that:
          - target_device in groups['all']
        fail_msg: "Equipement absent de l'inventaire AWX."

    - name: Verifier le constructeur
      ansible.builtin.assert:
        that:
          - hostvars[target_device].device_vendor | default('') | lower == 'aruba'
        fail_msg: "Equipement non identifie comme Aruba."

    - name: Construire le groupe temporaire
      ansible.builtin.add_host:
        name: "{{ target_device }}"
        groups: aruba_workflow_target
      changed_when: false


- name: Preflight et preparation transfert Secondary
  hosts: aruba_workflow_target
  gather_facts: false

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 120

    firmware_target: "WC.16.11.0030"
    firmware_primary_expected: "WC.16.11.0010"
    firmware_secondary_expected: "WC.16.07.0003"

    firmware_file: "/awx-storage/firmwares/aruba/2930F/WC_16_11_0030.swi"
    firmware_size_expected: 30294326
    firmware_sha256: "4749334ebdb4989c6176643b2daf57514441348778899895dc08d1c1d546e42d"

    tftp_server: "172.16.23.162"
    tftp_filename: "aruba/2930F/WC_16_11_0030.swi"

    archive_root: "/awx-storage/reports/aruba"
    workflow_id: "{{ awx_workflow_job_id | default('manual') }}"
    job_id: "{{ awx_job_id | default('manual') }}"
    run_dir: "{{ archive_root }}/{{ inventory_hostname }}/upgrade-{{ workflow_id }}-job-{{ job_id }}"

    proposed_command: >-
      copy tftp flash {{ tftp_server }} {{ tftp_filename }} secondary

    # --------------------------------------------------------
    # VERROUS DE SECURITE
    #
    # Ces valeurs sont volontairement fixes.
    # Les variables AWX ne doivent pas pouvoir les contourner.
    # --------------------------------------------------------
    transfer_implementation_enabled: false
    flash_capacity_confirmed: false
    compatibility_confirmed: false

  tasks:

    - name: Lire les metadonnees du firmware dans l'EE
      ansible.builtin.stat:
        path: "{{ firmware_file }}"
        checksum_algorithm: sha256
      register: image_file
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Verifier le fichier et son integrite
      ansible.builtin.assert:
        that:
          - image_file.stat.isreg | default(false)
          - image_file.stat.size | default(0) | int == firmware_size_expected
          - image_file.stat.checksum | default('') == firmware_sha256
        fail_msg: "Firmware absent, taille incorrecte ou SHA-256 non conforme."

    - name: Collecter show system
      ansible.netcommon.cli_command:
        command: show system
      register: system_result
      changed_when: false

    - name: Collecter show flash
      ansible.netcommon.cli_command:
        command: show flash
      register: flash_result
      changed_when: false

    - name: Extraire les versions Primary et Secondary
      ansible.builtin.set_fact:
        primary_versions: >-
          {{
            flash_result.stdout |
            regex_findall('(?im)Primary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)')
          }}
        secondary_versions: >-
          {{
            flash_result.stdout |
            regex_findall('(?im)Secondary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)')
          }}
      changed_when: false

    - name: Afficher les versions detectees
      ansible.builtin.debug:
        msg:
          - "Primary : {{ primary_versions }}"
          - "Secondary : {{ secondary_versions }}"
          - "Firmware cible : {{ firmware_target }}"

    - name: Verifier les partitions
      ansible.builtin.assert:
        that:
          - primary_versions | length == 1
          - secondary_versions | length == 1
          - primary_versions[0] == firmware_primary_expected
          - secondary_versions[0] == firmware_secondary_expected
        fail_msg: "Versions inattendues. Transfert interdit."

    - name: Verifier les informations systeme
      ansible.builtin.assert:
        that:
          - firmware_primary_expected in system_result.stdout
          - system_result.stdout is search('(?m)Memory\s*-\s*Total\s*:')
          - system_result.stdout is search('(?m)Free\s*:')
        fail_msg: "Etat systeme inattendu."

    - name: Creer le repertoire NFS
      ansible.builtin.file:
        path: "{{ run_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Archiver le rapport de preflight
      ansible.builtin.copy:
        dest: "{{ run_dir }}/secondary_preflight.json"
        mode: "0600"
        content: |
          {{
            {
              'phase': 'SECONDARY_PREFLIGHT_V03_1',
              'execution': 'BLOCKED_READ_ONLY',
              'target': inventory_hostname,
              'job': job_id,
              'firmware': firmware_target,
              'file_size_bytes': image_file.stat.size,
              'sha256': image_file.stat.checksum,
              'primary_before': primary_versions[0],
              'secondary_before': secondary_versions[0],
              'proposed_command_not_executed': proposed_command,
              'flash_capacity_confirmed': false,
              'compatibility_confirmed': false,
              'show_flash': flash_result.stdout,
              'show_system': system_result.stdout
            } | to_nice_json
          }}
      delegate_to: localhost
      vars:
        ansible_connection: local

    # ========================================================
    # GARDE-FOU AVANT TRANSFERT
    # ========================================================

    - name: Bloquer le transfert non homologue
      ansible.builtin.assert:
        that:
          - transfer_implementation_enabled | bool
          - flash_capacity_confirmed | bool
          - compatibility_confirmed | bool
        fail_msg: >-
          SECURITE : transfert Secondary bloque.
          Le preflight a ete archive dans
          {{ run_dir }}/secondary_preflight.json.
          Aucun transfert ni redemarrage execute.

    # ========================================================
    # TRANSFERT TFTP - NON ACTIF DANS CETTE VERSION
    #
    # Ce bloc est conserve comme SPECIFICATION uniquement.
    # Il n'est pas une tache Ansible executable.
    #
    # Commande :
    # copy tftp flash 172.16.23.162
    # aruba/2930F/WC_16_11_0030.swi secondary
    #
    # Invite :
    # Continue (y/n)?
    #
    # Reponse prevue :
    # y
    #
    # Le transfert devra etre implemente apres homologation
    # de la capacite flash et validation des controles.
    # ========================================================

    # - name: Transfert TFTP vers Secondary
    #   ansible.netcommon.cli_command:
    #     command: "{{ proposed_command }}"
    #     prompt:
    #       - 'Continue \(y/n\)\?'
    #     answer:
    #       - 'y'
    #   register: secondary_transfer_result
    #
    # NE PAS DECOMMENTER SANS REVUE DE SECURITE.
