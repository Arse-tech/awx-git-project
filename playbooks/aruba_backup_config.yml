
---
# ============================================================
# ORANGE LAB RUN - IEC
# SAUVEGARDE CONFIGURATION ARUBA AOS-S
#
# AWX 24.6.0
# Stockage NFS : /awx-storage
#
# Lecture seule sur le switch
# ============================================================

- name: Sauvegarder la configuration Aruba sur NFS
  hosts: all
  gather_facts: false

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 60

    backup_root: /awx-storage/backups/aruba
    backup_timestamp: "{{ now(utc=true, fmt='%Y%m%d_%H%M%S') }}"

  tasks:

    - name: Verifier le constructeur Aruba
      ansible.builtin.assert:
        that:
          - device_vendor | default('') | lower == 'aruba'
        fail_msg: >-
          Sauvegarde refusee : cet equipement
          n'est pas identifie comme Aruba.

    - name: Collecter la configuration courante
      ansible.netcommon.cli_command:
        command: show running-config
      register: running_config_result
      no_log: true

    - name: Verifier que la configuration a ete collectee
      ansible.builtin.assert:
        that:
          - running_config_result.stdout | default('') | trim | length > 0
        fail_msg: >-
          La configuration du switch est vide
          ou n'a pas pu etre collectee.
      no_log: true

    - name: Verifier que le stockage NFS est monte
      ansible.builtin.command:
        cmd: mountpoint -q /awx-storage
      delegate_to: localhost
      vars:
        ansible_connection: local
      changed_when: false

    - name: Creer le repertoire de sauvegarde
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Construire le nom du fichier de sauvegarde
      ansible.builtin.set_fact:
        backup_file: >-
          {{ backup_root }}/{{ inventory_hostname }}_{{ backup_timestamp }}.cfg

    - name: Enregistrer la configuration sur NFS
      ansible.builtin.copy:
        content: "{{ running_config_result.stdout }}"
        dest: "{{ backup_file }}"
        mode: '0600'
      delegate_to: localhost
      vars:
        ansible_connection: local
      no_log: true

    - name: Afficher le resultat de la sauvegarde
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - " ORANGE LAB RUN - IEC"
          - " SAUVEGARDE CONFIGURATION ARUBA"
          - "=============================================="
          - "Equipement : {{ inventory_hostname }}"
          - "Adresse IP : {{ ansible_host | default('Non definie') }}"
          - "Destination : {{ backup_file | trim }}"
          - "Statut : SAUVEGARDE TERMINEE"
          - "=============================================="
