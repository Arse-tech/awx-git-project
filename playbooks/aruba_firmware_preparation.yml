---
# JT02 v2.3 - Preparation firmware Aruba 2930F - SANS SSH
# Reutilise obligatoirement le snapshot JT01 du MEME workflow AWX.
# Pas de connexion reseau aux switches, pas de transfert TFTP, pas de flash, pas de reboot.
- name: Preparation firmware Aruba depuis snapshot JT01 (sans SSH)
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_connection: local
    archive_root: /awx-storage/reports/aruba
    workflow_id: "{{ awx_workflow_job_id | default('', true) }}"
    archive_dir: "{{ archive_root }}/{{ inventory_hostname }}/workflow-{{ workflow_id }}"
    snapshot_path: "{{ archive_dir }}/precheck_snapshot.json"
    firmware_target_version: 'WC.16.11.0030'
    firmware_file: /awx-storage/firmwares/aruba/2930F/WC_16_11_0030.swi
    firmware_size_expected: 30294326
    firmware_sha256_expected: '4749334ebdb4989c6176643b2daf57514441348778899895dc08d1c1d546e42d'
  tasks:
    - name: Verifier le contexte du workflow et les equipements selectionnes
      ansible.builtin.assert:
        that:
          - awx_workflow_job_id is defined
          - workflow_id | length > 0
          - ansible_limit is defined
          - (ansible_limit | default('') | trim) is match('^[A-Za-z0-9_.-]+([,:][A-Za-z0-9_.-]+)*$')
          - (ansible_limit | default('') | regex_findall('[^,:]+') | unique | sort | list) == (ansible_play_hosts_all | sort)
          - device_vendor | default('') | lower == 'aruba'
        fail_msg: >-
          Selection non transmise par le workflow, equipement inconnu,
          ou hote non Aruba. Aucun transfert possible.

    - name: Verifier le montage du stockage partage
      ansible.builtin.command:
        cmd: mountpoint -q /awx-storage
      changed_when: false

    - name: Verifier la presence du snapshot JT01 pour CE workflow
      ansible.builtin.stat:
        path: "{{ snapshot_path }}"
      register: snapshot_stat

    - name: Refuser toute absence de snapshot
      ansible.builtin.assert:
        that:
          - snapshot_stat.stat.exists | default(false)
          - snapshot_stat.stat.isreg | default(false)
        fail_msg: "Snapshot JT01 du workflow courant introuvable. Preparation interdite."

    - name: Lire le snapshot precheck (stockage local de l'EE)
      ansible.builtin.slurp:
        src: "{{ snapshot_path }}"
      register: snapshot_blob
      no_log: true

    - name: Decoder l'etat JT01
      ansible.builtin.set_fact:
        precheck_snapshot: "{{ snapshot_blob.content | b64decode | from_json }}"
      no_log: true

    - name: Verifier la provenance et la selection du snapshot
      ansible.builtin.assert:
        that:
          - precheck_snapshot.schema_version | default(0) | int == 1
          - precheck_snapshot.stage | default('') == 'jt01_precheck'
          - precheck_snapshot.status | default('') == 'passed'
          - precheck_snapshot.workflow_id | string == workflow_id | string
          - precheck_snapshot.hostname == inventory_hostname
          - precheck_snapshot.selected_hosts | sort == ansible_play_hosts_all | sort
          - precheck_snapshot.device_vendor | lower == 'aruba'
          - precheck_snapshot.initial_firmware.primary is defined
          - precheck_snapshot.initial_firmware.secondary is defined
          - precheck_snapshot.initial_firmware.running is defined
        fail_msg: >-
          Snapshot JT01 absent, corrompu, issu d'un autre workflow
          ou ne correspondant pas aux equipements selectionnes.

    - name: Verifier l'image SWI accessible depuis l'EE
      ansible.builtin.stat:
        path: "{{ firmware_file }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: firmware_stat

    - name: Controler SHA256, taille et version cible
      ansible.builtin.assert:
        that:
          - firmware_stat.stat.exists | default(false)
          - firmware_stat.stat.isreg | default(false)
          - firmware_stat.stat.readable | default(false)
          - firmware_stat.stat.size | default(0) | int == firmware_size_expected | int
          - firmware_stat.stat.checksum | default('') == firmware_sha256_expected
        fail_msg: "Image SWI absente ou empreinte/taille incorrecte. Preparation arretee."

    - name: Archiver la sauvegarde initiale de configuration depuis JT01
      ansible.builtin.copy:
        content: "{{ precheck_snapshot.running_config }}\n"
        dest: "{{ archive_dir }}/running_config_backup.txt"
        mode: '0600'
      no_log: true

    - name: Archiver la topologie VSF capturee dans JT01
      ansible.builtin.copy:
        content: "{{ precheck_snapshot.vsf_topology | default('') }}\n"
        dest: "{{ archive_dir }}/vsf_diagnostics.txt"
        mode: '0600'
      no_log: true

    - name: Archiver le plan de retour arriere sans action sur le switch
      ansible.builtin.copy:
        dest: "{{ archive_dir }}/rollback_plan.txt"
        mode: '0600'
        content: |-
          PLAN DE RETOUR ARRIERE - VALIDATION HUMAINE OBLIGATOIRE
          Equipement : {{ inventory_hostname }}
          Workflow AWX : {{ workflow_id }}
          Primary initiale : {{ precheck_snapshot.initial_firmware.primary }}
          Secondary initiale : {{ precheck_snapshot.initial_firmware.secondary }}
          Firmware cible : {{ firmware_target_version }}
          Ordre : ecriture Secondary, boot Secondary, validation, ecriture Primary, boot Primary.
          Avant ecriture Primary : conserver l'image Primary initiale comme repli.
          Apres remplacement de Primary : ancien firmware non garanti en flash.
          Toute bascule de boot ou restauration exige une approbation distincte.
          Compatibilite firmware/Boot ROM/VSF : a valider selon le modele.
          AUCUNE COMMANDE executee par JT02 sur le switch.

    - name: Enregistrer la preparation lisible au format TXT
      ansible.builtin.copy:
        dest: "{{ archive_dir }}/preparation_report.txt"
        mode: '0600'
        content: |-
          PREPARATION FIRMWARE - JT02 SANS SSH
          Switch : {{ inventory_hostname }}
          Workflow : {{ workflow_id }}
          Selection : {{ ansible_play_hosts_all | sort | join(', ') }}
          Primary initiale : {{ precheck_snapshot.initial_firmware.primary }}
          Secondary initiale : {{ precheck_snapshot.initial_firmware.secondary }}
          Firmware cible : {{ firmware_target_version }}
          Firmware dans EE : {{ firmware_file }}
          SHA256 controle : {{ firmware_sha256_expected }}
          Verification TFTP depuis switch : non effectuee
          Compatibilite firmware constructeur : a valider
          Autorisation AWX : non verifiee
          Connexion SSH JT02 : aucune
          Flash / transfert / reboot : aucune operation

    - name: Enregistrer le rapport JSON de preparation
      ansible.builtin.copy:
        dest: "{{ archive_dir }}/preparation_v23.json"
        mode: '0600'
        content: |
          {{
            {
              "stage": "jt02_preparation_v23",
              "status": "passed",
              "workflow_id": workflow_id,
              "job_id": awx_job_id | default(""),
              "hostname": inventory_hostname,
              "selected_hosts": ansible_play_hosts_all | sort,
              "initial_firmware": precheck_snapshot.initial_firmware,
              "firmware_target": firmware_target_version,
              "firmware_size": firmware_stat.stat.size,
              "firmware_sha256": firmware_stat.stat.checksum,
              "precheck_snapshot_path": snapshot_path,
              "tftp_verified_from_switch": false,
              "approval_awx_verified": false,
              "transfer_executed": false,
              "reboot_executed": false,
              "ssh_connection_executed": false
            } | to_nice_json
          }}

    - name: Afficher le bilan de preparation sans SSH
      ansible.builtin.debug:
        msg:
          - "Switch : {{ inventory_hostname }}"
          - "Workflow : {{ workflow_id }}"
          - "Selection : {{ ansible_play_hosts_all | sort | join(', ') }}"
          - "Primary initiale : {{ precheck_snapshot.initial_firmware.primary }}"
          - "Secondary initiale : {{ precheck_snapshot.initial_firmware.secondary }}"
          - "Firmware cible : {{ firmware_target_version }}"
          - "SHA256 EE : conforme"
          - "Connexion SSH JT02 : aucune"
          - "Rapport : {{ archive_dir }}/preparation_v23.json"
          - "Aucun transfert, flash ou reboot"
