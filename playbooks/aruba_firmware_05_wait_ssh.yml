---
# JT05 V05.1 - Retour SSH apres activation Secondary.
# Ne commande jamais de reboot. Un etat JT04 ambigu bloque le workflow.
- name: JT05 V05.1 - Attendre le retour SSH apres activation confirmee
  hosts: all
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  vars_files:
    - ../vars/aruba_firmware_devices.yml
  vars:
    ansible_connection: local
    archive_root: /awx-storage/reports/aruba
    workflow_id: "{{ awx_workflow_job_id | default('', true) | string }}"
    report_dir: "{{ archive_root }}/{{ inventory_hostname }}/workflow-{{ workflow_id }}"
    activation_report_path: "{{ report_dir }}/activation_v05.json"
  tasks:
    - name: Verifier contexte et perimetre
      ansible.builtin.assert:
        that:
          - workflow_id is match('^[0-9]+$')
          - ansible_limit is defined
          - (ansible_limit | default('') | trim) is match('^[A-Za-z0-9_.-]+([,:][A-Za-z0-9_.-]+)*$')
          - (ansible_limit | regex_findall('[^,:]+') | unique | sort | list) == (ansible_play_hosts_all | sort)
          - inventory_hostname in (jt04_allowed_hosts | default([]))
          - device_vendor | default('') | lower == 'aruba'
          - ansible_host is defined
    - name: Verifier le montage NFS
      ansible.builtin.command: mountpoint -q /awx-storage
      changed_when: false
    - name: Verifier le fichier d'activation
      ansible.builtin.stat:
        path: "{{ activation_report_path }}"
      register: activation_stat
    - name: Exiger un rapport regulier
      ansible.builtin.assert:
        that:
          - activation_stat.stat.isreg | default(false) | bool
    - name: Lire le rapport d'activation JT04
      ansible.builtin.slurp:
        src: "{{ activation_report_path }}"
      register: activation_raw
      no_log: true
    - name: Decoder le rapport JT04
      ansible.builtin.set_fact:
        activation_report: "{{ activation_raw.content | b64decode | from_json }}"
      no_log: true
    - name: Refuser toute activation non confirmee ou ambigue
      ansible.builtin.assert:
        that:
          - activation_report.stage | default('') == 'jt04_activation'
          - activation_report.workflow_id | default('') | string == workflow_id
          - activation_report.hostname | default('') == inventory_hostname
          - (activation_report.selected_hosts | default([]) | sort) == (ansible_play_hosts_all | sort)
          - activation_report.status | default('') == 'reboot_requested'
          - activation_report.activation_executed | default(false) | bool
          - activation_report.reboot_requested | default(false) | bool
        fail_msg: >-
          Rapport JT04 absent, non confirme ou ambigu. Ne pas relancer JT04.
          Examiner l'etat reel du switch et traiter manuellement l'incident.
    - name: Marquer le preflight comme valide
      ansible.builtin.set_fact:
        jt05_preflight_ok: true
    - name: Barriere globale avant attente
      ansible.builtin.assert:
        that:
          - (ansible_play_hosts_all | map('extract', hostvars, 'jt05_preflight_ok') | select('equalto', true) | list | length) == (ansible_play_hosts_all | length)
    - name: Attendre le retour du port SSH
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) | int }}"
        state: started
        connect_timeout: 5
        delay: 20
        sleep: 10
        timeout: 900
    - name: Enregistrer l'accessibilite TCP seulement
      ansible.builtin.copy:
        dest: "{{ report_dir }}/wait_ssh_v05.json"
        mode: '0600'
        content: |
          {{ {'stage': 'jt05_wait_ssh', 'status': 'ssh_port_reachable', 'workflow_id': workflow_id, 'hostname': inventory_hostname, 'selected_hosts': ansible_play_hosts_all | sort, 'ssh_port_reachable': true, 'firmware_verified': false, 'reboot_independently_verified': false} | to_nice_json }}
