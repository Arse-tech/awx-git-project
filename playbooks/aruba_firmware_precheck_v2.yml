---
# JT01 v2.3 - precheck multi-switch, snapshot partage, connexion SSH initiale
# Aucun changement sur les switches. Selection unique par Limit du workflow.
- name: ORANGE LAB RUN - Precheck firmware Aruba AOS-S avec archivage NFS
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 60
    archive_root: /awx-storage/reports/aruba
    workflow_id: "{{ awx_workflow_job_id | default('', true) }}"
    archive_run_id: "{{ workflow_id }}-job-{{ awx_job_id | default('manual', true) }}"
    archive_dir: "{{ archive_root }}/{{ inventory_hostname }}/workflow-{{ workflow_id }}"
    precheck_required_commands:
      - show version
      - show system
      - show flash
      - show interfaces brief
      - show vlan
      - show running-config
    precheck_optional_commands:
      - show interfaces status
      - show system power-supply
      - show system fans
      - show cpu
      - show vsf topology
      - show time
      - show spanning-tree
      - show uptime
      - show loop-protect
      - show boot-history
  tasks:
    - name: Refuser toute execution sans selection explicite et valider Aruba
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - awx_workflow_job_id is defined
          - workflow_id | length > 0
          - (ansible_limit | default('') | trim) is match('^[A-Za-z0-9_.-]+([,:][A-Za-z0-9_.-]+)*$')
          - (ansible_limit | default('') | regex_findall('[^,:]+') | unique | sort | list) == (ansible_play_hosts_all | sort)
          - inventory_hostname != 'localhost'
          - device_vendor | default('') | lower == 'aruba'
          - ansible_play_hosts_all | length > 0
        fail_msg: >-
          Selection Limit absente, hote non Aruba ou selection invalide.
          Choisir explicitement un ou plusieurs switches dans le Limit du workflow.
        success_msg: "Cible autorisee : {{ inventory_hostname }}"

    - name: Verifier le montage NFS dans le conteneur d'execution
      ansible.builtin.command:
        cmd: mountpoint -q /awx-storage
      delegate_to: localhost
      vars:
        ansible_connection: local
      changed_when: false

    - name: Creer le repertoire de rapport NFS
      ansible.builtin.file:
        path: "{{ archive_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Collecter les informations essentielles
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ precheck_required_commands }}"
      loop_control:
        label: "{{ item }}"
      register: required_results
      failed_when: false
      no_log: true

    - name: Collecter les informations complementaires
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ precheck_optional_commands }}"
      loop_control:
        label: "{{ item }}"
      register: optional_results
      failed_when: false
      no_log: true

    - name: Construire les resultats de collecte
      ansible.builtin.set_fact:
        all_cli_results: "{{ required_results.results + optional_results.results }}"
      no_log: true

    - name: Generer la transcription CLI complete
      ansible.builtin.set_fact:
        cli_session_text: |-
          ============================================================
           ORANGE LAB RUN - IEC
           SESSION CLI - PRECHECK FIRMWARE ARUBA
          ============================================================
          Equipement : {{ inventory_hostname }}
          Adresse IP : {{ ansible_host | default('Non definie') }}
          Job AWX   : {{ archive_run_id }}
          ============================================================
          {% for result in all_cli_results %}

          {{ inventory_hostname }}# {{ result.item }}

          {% if result.failed | default(false) or result.stdout | default('') | trim | length == 0 %}
          [COLLECTE NON VALIDEE : commande en echec ou sortie vide]
          {% else %}
          {{ result.stdout | default('') }}
          {% endif %}

          ------------------------------------------------------------
          {% endfor %}
          FIN DE SESSION CLI - {{ all_cli_results | length }} commandes
      no_log: true

    - name: Enregistrer la session CLI unique sur NFS
      ansible.builtin.copy:
        content: "{{ cli_session_text }}\n"
        dest: "{{ archive_dir }}/precheck_cli_session.txt"
        mode: '0600'
      delegate_to: localhost
      vars:
        ansible_connection: local
      no_log: true

    - name: Enregistrer les resultats JSON sur NFS
      ansible.builtin.copy:
        content: "{{ {'hostname': inventory_hostname, 'ip': ansible_host | default(''), 'awx_job': archive_run_id, 'required_commands': precheck_required_commands, 'optional_commands': precheck_optional_commands, 'results': all_cli_results | map(attribute='stdout') | list} | to_nice_json }}\n"
        dest: "{{ archive_dir }}/precheck_results.json"
        mode: '0600'
      delegate_to: localhost
      vars:
        ansible_connection: local
      no_log: true

    - name: Evaluer les commandes essentielles
      ansible.builtin.set_fact:
        required_invalid: >-
          {{ required_results.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
             or required_results.results | selectattr('stdout', 'undefined') | list | length > 0
             or required_results.results | selectattr('stdout', 'equalto', '') | list | length > 0
             or required_results.results | map(attribute='stdout') | select('search', 'Invalid input|Invalid command|Unknown command') | list | length > 0 }}
      no_log: true

    - name: Enregistrer le rapport de synthese TXT
      ansible.builtin.copy:
        content: |-
          ORANGE LAB RUN - IEC
          PRECHECK FIRMWARE ARUBA
          Equipement : {{ inventory_hostname }}
          Adresse IP : {{ ansible_host | default('Non definie') }}
          Constructeur : {{ device_vendor | default('Aruba') }}
          Role : {{ device_role | default('Non defini') }}
          Statut inventaire : {{ device_status | default('Non defini') }}
          Job AWX : {{ archive_run_id }}
          Commandes essentielles : {{ precheck_required_commands | length }}
          Commandes complementaires : {{ precheck_optional_commands | length }}
          Validation essentielles : {{ 'ECHEC' if required_invalid | bool else 'OK' }}
          Controle automatique VSF : non effectue
          Aucune modification effectuee sur le switch
        dest: "{{ archive_dir }}/precheck_report.txt"
        mode: '0600'
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Generer le rapport PDF V2.1 sur NFS
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/generate_aruba_precheck_pdf_v2.py"
          - --input
          - "{{ archive_dir }}/precheck_results.json"
          - --output
          - "{{ archive_dir }}/precheck_report.pdf"
      delegate_to: localhost
      vars:
        ansible_connection: local
      changed_when: true

    - name: Proteger le rapport PDF
      ansible.builtin.file:
        path: "{{ archive_dir }}/precheck_report.pdf"
        mode: '0600'
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Valider les commandes essentielles
      ansible.builtin.assert:
        that:
          - not (required_invalid | bool)
        fail_msg: "Une ou plusieurs commandes essentielles sont invalides. Voir les fichiers archives sur NFS."
        success_msg: "Les 6 commandes essentielles ont ete validees."

    - name: Analyser les versions et images de demarrage du precheck
      ansible.builtin.set_fact:
        initial_primary: >-
          {{ required_results.results[2].stdout | regex_findall('(?im)^Primary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)') }}
        initial_secondary: >-
          {{ required_results.results[2].stdout | regex_findall('(?im)^Secondary Image\s*:\s*\d+\s+\S+\s+(WC\.\d+\.\d+\.\d+)') }}
        initial_running: >-
          {{ required_results.results[0].stdout | regex_findall('(?m)^\s*(WC\.\d+\.\d+\.\d+)\s*$') }}
        initial_active_image: >-
          {{ required_results.results[0].stdout | regex_findall('(?im)^Boot Image:\s*(Primary|Secondary)\s*$') }}
        initial_default_image: >-
          {{ required_results.results[2].stdout | regex_findall('(?im)^Default Boot Image\s*:\s*(Primary|Secondary)\s*$') }}
      no_log: true

    - name: Refuser les etats flash ambigus
      ansible.builtin.assert:
        that:
          - initial_primary | length == 1
          - initial_secondary | length == 1
          - initial_running | length == 1
          - initial_active_image | length == 1
          - initial_default_image | length == 1
        fail_msg: "Versions ou images de demarrage ambigues. Arret du lot avant JT02."

    - name: Construire le snapshot JT01 reutilisable par JT02
      ansible.builtin.set_fact:
        precheck_snapshot:
          schema_version: 1
          stage: jt01_precheck
          status: passed
          workflow_id: "{{ workflow_id }}"
          job_id: "{{ awx_job_id | default('') }}"
          selected_hosts: "{{ ansible_play_hosts_all | sort }}"
          hostname: "{{ inventory_hostname }}"
          ip: "{{ ansible_host | default('') }}"
          device_vendor: "{{ device_vendor | default('') }}"
          initial_firmware:
            primary: "{{ initial_primary[0] }}"
            secondary: "{{ initial_secondary[0] }}"
            running: "{{ initial_running[0] }}"
            boot_image: "{{ initial_active_image[0] }}"
            default_boot: "{{ initial_default_image[0] }}"
          raw_show_version: "{{ required_results.results[0].stdout }}"
          raw_show_flash: "{{ required_results.results[2].stdout }}"
          running_config: "{{ required_results.results[5].stdout }}"
          vsf_topology: "{{ optional_results.results[4].stdout | default('') }}"
      no_log: true

    - name: Enregistrer le snapshot de reference NFS pour la suite du workflow
      ansible.builtin.copy:
        content: "{{ precheck_snapshot | to_nice_json }}\n"
        dest: "{{ archive_dir }}/precheck_snapshot.json"
        mode: '0600'
      delegate_to: localhost
      vars:
        ansible_connection: local
      no_log: true

    - name: Afficher le statut des commandes complementaires
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} : {{ 'NON VALIDEE' if
          (item.failed | default(false) or
          item.stdout | default('') | trim | length == 0 or
          'Invalid input' in (item.stdout | default('')) or
          'Invalid command' in (item.stdout | default('')) or
          'Unknown command' in (item.stdout | default('')))
          else 'COLLECTEE' }}
      loop: "{{ optional_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Afficher le resume du precheck
      ansible.builtin.debug:
        msg:
          - "Equipement : {{ inventory_hostname }}"
          - "Selection workflow Limit : {{ ansible_limit | default('ABSENT') }}"
          - "Nombre d'equipements selectionnes : {{ ansible_play_hosts_all | length }}"
          - "Commandes essentielles : {{ precheck_required_commands | length }}"
          - "Commandes complementaires : {{ precheck_optional_commands | length }}"
          - "Session CLI : {{ archive_dir }}/precheck_cli_session.txt"
          - "Rapport TXT : {{ archive_dir }}/precheck_report.txt"
          - "Rapport PDF : {{ archive_dir }}/precheck_report.pdf"
          - "Resultats JSON : {{ archive_dir }}/precheck_results.json"
          - "Snapshot JT01 : {{ archive_dir }}/precheck_snapshot.json"
          - "Controle automatique VSF : non effectue"
          - "Aucune modification effectuee sur le switch"
