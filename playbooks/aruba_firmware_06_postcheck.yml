---
# JT06 - Postcheck reel en SSH. Aucun changement sur le switch.
- name: JT06 - Verifier les versions apres redemarrage
  hosts: all
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  vars_files:
    - ../vars/aruba_firmware_devices.yml
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_command_timeout: 120
    workflow_id: "{{ awx_workflow_job_id | default('', true) | string }}"
    report_dir: "/awx-storage/reports/aruba/{{ inventory_hostname }}/workflow-{{ workflow_id }}"
  tasks:
    - name: Exiger un contexte AWX et un Limit explicite
      ansible.builtin.assert:
        that:
          - workflow_id is match('^[0-9]+$')
          - ansible_limit is defined
          - (ansible_limit | default('') | regex_findall('[^,:]+') | unique | sort | list) == (ansible_play_hosts_all | sort)
          - inventory_hostname in (jt04_allowed_hosts | default([]))
          - device_vendor | default('') | lower == 'aruba'
    - name: Lire la preuve de retour SSH JT05
      ansible.builtin.slurp:
        src: "{{ report_dir }}/wait_ssh_v05.json"
      register: wait_raw
      delegate_to: localhost
      vars:
        ansible_connection: local
      no_log: true
    - name: Decoder la preuve JT05
      ansible.builtin.set_fact:
        wait_report: "{{ wait_raw.content | b64decode | from_json }}"
      no_log: true
    - name: Exiger le retour SSH du workflow courant
      ansible.builtin.assert:
        that:
          - wait_report.workflow_id | string == workflow_id
          - wait_report.hostname == inventory_hostname
          - wait_report.selected_hosts | sort == ansible_play_hosts_all | sort
          - wait_report.status == 'ssh_port_reachable'
          - wait_report.ssh_port_reachable | bool
    - name: Lire show version
      ansible.netcommon.cli_command:
        command: show version
      register: version_after
      changed_when: false
      retries: 12
      delay: 15
      until: version_after is succeeded
    - name: Lire show flash
      ansible.netcommon.cli_command:
        command: show flash
      register: flash_after
      changed_when: false
    - name: Extraire les versions et images
      ansible.builtin.set_fact:
        primary_after: "{{ flash_after.stdout | regex_findall('(?im)^Primary Image\\s*:\\s*\\d+\\s+\\S+\\s+(WC\\.\\d+\\.\\d+\\.\\d+)') }}"
        secondary_after: "{{ flash_after.stdout | regex_findall('(?im)^Secondary Image\\s*:\\s*\\d+\\s+\\S+\\s+(WC\\.\\d+\\.\\d+\\.\\d+)') }}"
        running_after: "{{ version_after.stdout | regex_findall('(?m)^\\s*(WC\\.\\d+\\.\\d+\\.\\d+)\\s*$') }}"
        active_after: "{{ version_after.stdout | regex_findall('(?im)^Boot Image:\\s*(Primary|Secondary)\\s*$') }}"
        default_after: "{{ flash_after.stdout | regex_findall('(?im)^Default Boot Image\\s*:\\s*(Primary|Secondary)\\s*$') }}"
    - name: Verifier la mise a niveau et le repli Primary
      ansible.builtin.assert:
        that:
          - primary_after | length == 1
          - secondary_after | length == 1
          - running_after | length == 1
          - active_after | length == 1
          - default_after | length == 1
          - primary_after[0] == aruba_firmware_devices[inventory_hostname].primary_before
          - secondary_after[0] == aruba_firmware_target.version
          - running_after[0] == aruba_firmware_target.version
          - active_after[0] == 'Secondary'
          - default_after[0] == 'Secondary'
        fail_msg: "POSTCHECK ECHEC : ne pas poursuivre vers une ecriture Primary."
    - name: Barriere globale postcheck
      ansible.builtin.set_fact:
        jt06_postcheck_ok: true
    - name: Exiger la reussite de tous les switches
      ansible.builtin.assert:
        that:
          - (ansible_play_hosts_all | map('extract', hostvars, 'jt06_postcheck_ok') | select('equalto', true) | list | length) == (ansible_play_hosts_all | length)
    - name: Archiver le postcheck
      ansible.builtin.copy:
        dest: "{{ report_dir }}/postcheck_v06.json"
        mode: '0600'
        content: |
          {{ {'stage': 'jt06_postcheck', 'status': 'passed', 'workflow_id': workflow_id, 'hostname': inventory_hostname, 'selected_hosts': ansible_play_hosts_all | sort, 'primary': primary_after[0], 'secondary': secondary_after[0], 'running': running_after[0], 'active_image': active_after[0], 'default_image': default_after[0], 'reboot_executed_by_jt06': false} | to_nice_json }}
      delegate_to: localhost
      vars:
        ansible_connection: local
